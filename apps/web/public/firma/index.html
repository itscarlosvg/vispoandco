<button type="button" id="copy">Copiar firma</button>
</main>
<script>
  const btn=document.getElementById('copy'),box=document.getElementById('firma');
  btn.addEventListener('click',async()=>{
    let ok=false;
    try{const html=box.innerHTML.trim(),text=box.innerText;
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);ok=true;}
    catch(_){const r=document.createRange();r.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(r);
      try{ok=document.execCommand('copy');}catch(_){}s.removeAllRanges();}
    btn.textContent=ok?'Copiada':'Mantén pulsado y copia';btn.classList.toggle('ok',ok);
    setTimeout(()=>{btn.textContent='Copiar firma';btn.classList.remove('ok');},2200);
  });
</script>
