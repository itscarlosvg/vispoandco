<div class="login" id="login" hidden>
  <form class="lg-card" id="lgForm" novalidate>
    <div class="lg-logo">{{LOGO}}</div>
    <div class="f"><label for="lgMail">Email</label><input type="email" id="lgMail" autocomplete="username" required></div>
    <div class="f"><label for="lgPass">Contraseña</label><input type="password" id="lgPass" autocomplete="current-password" required></div>
    <p class="err" id="lgErr" role="alert"></p>
    <button class="btn" type="submit" id="lgGo">Entrar</button>
    <button class="lg-new" type="button" id="lgNew">Crear cuenta</button>
  </form>
</div>
