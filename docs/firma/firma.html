<div class="acts"><button type="button" id="copy">Copiar firma</button><button type="button" id="code" class="alt">Copiar código</button></div>

<script>
  const box=document.getElementById('firma');
  const flash=(b,ok,t)=>{b.textContent=ok?'Copiada':'No se pudo copiar';b.classList.toggle('ok',ok);setTimeout(()=>{b.textContent=t;b.classList.remove('ok');},2200);};
  async function copy(b,t,asCode){let ok=false;const html=box.innerHTML.trim();
    try{await navigator.clipboard.write([new ClipboardItem(asCode?{'text/plain':new Blob([html],{type:'text/plain'})}:{'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([box.innerText],{type:'text/plain'})})]);ok=true;}
    catch(_){try{if(asCode){await navigator.clipboard.writeText(html);ok=true;}else{const r=document.createRange();r.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(r);ok=document.execCommand('copy');s.removeAllRanges();}}catch(_){}}
    flash(b,ok,t);}
  document.getElementById('copy').addEventListener('click',e=>copy(e.currentTarget,'Copiar firma',false));
  document.getElementById('code').addEventListener('click',e=>copy(e.currentTarget,'Copiar código',true));
</script>
